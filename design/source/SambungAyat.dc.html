<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Continue the Ayah game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EC; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; gap: 16px; padding: 48px 18px 24px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="HafalanMap.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #EADFC8">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800; line-height: 1.1">Continue the Ayah</span>
      <span style="font-size: 12px; font-weight: 700; color: #5B6661">Murojaah · Al-Kawthar</span>
    </div>
    <span style="font-size: 13px; font-weight: 800; background: #FFFFFF; border-radius: 999px; padding: 8px 12px">1 / 2</span>
  </div>

  <div style="background: #0F6B5C; border-radius: 26px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: #FFFFFF">
    <span style="font-size: 13px; font-weight: 800; color: #CDE7DF">The reciter says…</span>
    <p dir="rtl" lang="ar" style="margin: 0; font-family: 'Amiri Quran', serif; font-size: 32px; line-height: 1.8; text-align: center">إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ ﴿١﴾</p>
    <button type="button" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #F2B33D; color: #23302C; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="#23302C"></path></svg>
      Play again
    </button>
  </div>

  <span style="font-size: 16px; font-weight: 800; text-align: center">What comes next?</span>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{ opts }}" as="o" hint-placeholder-count="3">
      <sc-if value="{{ o.right }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ o.pick }}" dir="rtl" lang="ar" style="min-height: 72px; border-radius: 18px; border: 3px solid #0F6B5C; background: #DCEFE9; font-family: 'Amiri Quran', serif; font-size: 26px; color: #23302C; cursor: pointer">{{ o.ar }}</button>
      </sc-if>
      <sc-if value="{{ o.wrong }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ o.pick }}" dir="rtl" lang="ar" style="min-height: 72px; border-radius: 18px; border: 3px solid #E0734F; background: #FBE3D9; font-family: 'Amiri Quran', serif; font-size: 26px; color: #23302C; cursor: pointer">{{ o.ar }}</button>
      </sc-if>
      <sc-if value="{{ o.idle }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ o.pick }}" dir="rtl" lang="ar" style="min-height: 72px; border-radius: 18px; border: 2px solid #E3D8C1; background: #FFFFFF; font-family: 'Amiri Quran', serif; font-size: 26px; color: #23302C; cursor: pointer; box-shadow: 0 3px 0 #EADFC8">{{ o.ar }}</button>
      </sc-if>
    </sc-for>
  </div>

  <p style="margin: 0; text-align: center; font-size: 14px; font-weight: 800; color: #4F5A55; min-height: 20px">{{ feedback }}</p>
  <div style="flex-grow: 1"></div>
  <sc-if value="{{ solved }}" hint-placeholder-val="{{ false }}">
    <a href="Reward.dc.html" style="min-height: 56px; border-radius: 999px; background: #0F6B5C; color: #FFFFFF; font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Next</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: null };
}
renderVals() {
const p = this.state.picked;
const opts = [
{ ar: 'إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ', ok: false },
{ ar: 'فَصَلِّ لِرَبِّكَ وَانْحَرْ', ok: true },
{ ar: 'اللَّهُ الصَّمَدُ', ok: false }
];
const solved = p !== null && opts[p].ok;
return {
solved,
feedback: p === null ? '' : (solved ? 'Correct! That is ayah 2.' : 'Not this one. Listen again and try once more.'),
opts: opts.map((o, i) => ({ ar: o.ar, right: p === i && o.ok, wrong: p === i && !o.ok, idle: p !== i, pick: () => this.setState({ picked: i }) }))
};
}
}
</script>
</body>
</html>
