<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Child recordings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; gap: 12px; padding: 48px 18px 20px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="WeeklyReport.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 23px; font-weight: 800; line-height: 1.1">Yusuf's recordings</h1>
      <span style="font-size: 12px; font-weight: 700; color: #5B6661">Stored on this phone only</span>
    </div>
  </div>

  <sc-for list="{{ recs }}" as="r" hint-placeholder-count="5">
    <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800">{{ r.title }}</span><span style="font-size: 12px; font-weight: 600; color: #5B6661">{{ r.when }}</span></span>
        <span style="font-size: 12px; font-weight: 700; color: #5B6661">{{ r.len }}</span>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1; min-height: 40px; border-radius: 999px; border: none; background: #0F6B5C; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; cursor: pointer">Play Yusuf</button>
        <button type="button" style="flex: 1; min-height: 40px; border-radius: 999px; border: 2px solid #0F6B5C; background: #FFFFFF; color: #0F6B5C; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; cursor: pointer">Compare with reciter</button>
        <button type="button" aria-label="Delete recording" style="width: 40px; min-height: 40px; border-radius: 999px; border: 2px solid #E3D8C1; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6661" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
        </button>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { recs: [
{ title: 'Quraysh · ayah 1–4', when: 'Today', len: '0:21' },
{ title: 'Al-Kawthar · ayah 2', when: 'Yesterday', len: '0:06' },
{ title: 'Al-Ikhlas · full surah', when: '2 days ago', len: '0:15' },
{ title: 'An-Nas · ayah 4–6', when: '4 days ago', len: '0:14' },
{ title: 'Letter Jim', when: 'Last week', len: '0:03' }
] };
}
}
</script>
</body>
</html>
