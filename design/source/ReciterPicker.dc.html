<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a reciter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EC; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; gap: 12px; padding: 48px 18px 24px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="MushafPage.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #EADFC8">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800">Choose a reciter</h1>
  </div>
  <p style="margin: 0; font-size: 14px; font-weight: 600; color: #5B6661">Young children copy other children more easily. Every reciter reads Hafs 'an 'Asim.</p>

  <sc-for list="{{ list }}" as="r" hint-placeholder-count="4">
    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 12px 14px; box-shadow: {{ r.ring }}">
      <button type="button" onClick="{{ r.pick }}" aria-pressed="{{ r.pressed }}" style="flex-grow: 1; display: flex; align-items: center; gap: 12px; border: none; background: transparent; padding: 0; text-align: left; cursor: pointer; font-family: 'Nunito', sans-serif; color: #23302C; min-height: 48px">
        <span style="width: 44px; height: 44px; border-radius: 50%; background: {{ r.bg }}; flex-shrink: 0"></span>
        <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800">{{ r.name }}</span><span style="font-size: 12px; font-weight: 600; color: #5B6661">{{ r.note }}</span></span>
      </button>
      <button type="button" aria-label="Hear a sample" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #0F6B5C; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="#0F6B5C"></path></svg>
      </button>
    </div>
  </sc-for>
  <div style="flex-grow: 1"></div>
  <p style="margin: 0; font-size: 12px; font-weight: 600; color: #5B6661; text-align: center">Reciter names shown are placeholders until licences are signed.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { pick: 0 };
}
renderVals() {
const rows = [
{ name: 'Child voice · boy', note: 'Slow and clear · Juz 30 included', bg: '#D7E8F5' },
{ name: 'Child voice · girl', note: 'Slow and clear · Juz 30 included', bg: '#F7D3C5' },
{ name: '[Adult reciter 1]', note: 'Murattal · download per juz', bg: '#DCEFE9' },
{ name: '[Adult reciter 2]', note: 'Murattal · download per juz', bg: '#FCE7B8' }
];
return { list: rows.map((r, i) => ({ ...r, pressed: this.state.pick === i ? 'true' : 'false', ring: this.state.pick === i ? 'inset 0 0 0 3px #0F6B5C' : '0 2px 0 #EADFC8', pick: () => this.setState({ pick: i }) })) };
}
}
</script>
</body>
</html>
