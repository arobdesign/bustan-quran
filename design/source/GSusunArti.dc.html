<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build the Meaning game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EC; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; gap: 16px; padding: 48px 18px 28px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="GameList.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #EADFC8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; flex-direction: column; align-items: center"><span style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800; line-height: 1.1">Build the Meaning</span><span style="font-size: 12px; font-weight: 700; color: #5B6661">Al-Ikhlas · ayah 1</span></div>
    <span style="width: 48px"></span>
  </div>
  <div style="background: #FFFDF7; border: 3px solid #0F6B5C; border-radius: 22px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px">
    <p dir="rtl" lang="ar" style="margin: 0; font-family: 'Amiri Quran', serif; font-size: 34px; line-height: 1.8; text-align: center">قُلْ هُوَ اللَّهُ أَحَدٌ</p>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; border-top: 2px dashed #E3D8C1; padding-top: 12px">
      <sc-for list="{{ built }}" as="b" hint-placeholder-count="2">
        <span style="min-height: 44px; padding: 0 14px; border-radius: 12px; background: #DCEFE9; font-size: 16px; font-weight: 800; display: flex; align-items: center">{{ b.t }}</span>
      </sc-for>
    </div>
  </div>
  <p style="margin: 0; font-size: 15px; font-weight: 800; text-align: center">Tap the words in the right order</p>
  <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center">
    <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="4">
      <button type="button" onClick="{{ t.tap }}" style="min-height: 56px; padding: 0 18px; border-radius: 16px; border: none; background: #FFFFFF; box-shadow: 0 4px 0 #0F6B5C; font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 800; color: #23302C; cursor: pointer; opacity: {{ t.op }}">{{ t.t }}</button>
    </sc-for>
  </div>
  <p style="margin: 0; text-align: center; font-size: 14px; font-weight: 800; color: #4F5A55">{{ msg }}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { n: 0, msg: '' }; }
renderVals() {
const s = this.state;
const right = ['Say,', 'He is', 'Allah,', 'the One.'];
const shown = ['the One.', 'Say,', 'Allah,', 'He is'];
return {
msg: s.n === 4 ? 'MashaAllah! Say, He is Allah, the One.' : s.msg,
built: right.slice(0, s.n).map((t) => ({ t })),
tiles: shown.map((t) => ({ t, op: right.indexOf(t) < s.n ? 0.3 : 1, tap: () => {
if (right.indexOf(t) < s.n) return;
if (t === right[s.n]) this.setState({ n: s.n + 1, msg: '' }); else this.setState({ msg: 'Hmm, which word comes next?' });
} }))
};
}
}
</script>
</body>
</html>
