<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My cards and badges</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FCE7B8; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 48px 18px 12px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 26px; font-weight: 800">My collection</h1>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #F6D58E; border-radius: 999px; padding: 4px">
      <sc-if value="{{ isCards }}" hint-placeholder-val="{{ true }}">
        <button type="button" role="tab" aria-selected="true" onClick="{{ showCards }}" style="min-height: 44px; border: none; border-radius: 999px; background: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; color: #23302C; cursor: pointer">Animal cards · 4/12</button>
        <button type="button" role="tab" aria-selected="false" onClick="{{ showBadges }}" style="min-height: 44px; border: none; border-radius: 999px; background: transparent; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; color: #23302C; cursor: pointer">Badges · 3/8</button>
      </sc-if>
      <sc-if value="{{ isBadges }}" hint-placeholder-val="{{ false }}">
        <button type="button" role="tab" aria-selected="false" onClick="{{ showCards }}" style="min-height: 44px; border: none; border-radius: 999px; background: transparent; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; color: #23302C; cursor: pointer">Animal cards · 4/12</button>
        <button type="button" role="tab" aria-selected="true" onClick="{{ showBadges }}" style="min-height: 44px; border: none; border-radius: 999px; background: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; color: #23302C; cursor: pointer">Badges · 3/8</button>
      </sc-if>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 4px 18px; overflow: hidden">
    <sc-if value="{{ isCards }}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{ cards }}" as="c" hint-placeholder-count="12">
          <sc-if value="{{ c.got }}" hint-placeholder-val="{{ false }}">
            <div style="background: #FFFFFF; border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 3px 0 #E7B96A">
              <span style="height: 74px; border-radius: 12px; background: {{ c.bg }}; display: flex; align-items: center; justify-content: center"><span style="width: 40px; height: 34px; border-radius: 50% 50% 44% 44%; background: {{ c.fg }}"></span></span>
              <span style="font-size: 13px; font-weight: 800; text-align: center">{{ c.name }}</span>
            </div>
          </sc-if>
          <sc-if value="{{ c.missing }}" hint-placeholder-val="{{ true }}">
            <div style="background: #FBF0D5; border: 2px dashed #E7B96A; border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 6px">
              <span style="height: 70px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', sans-serif; font-size: 30px; font-weight: 800; color: #B8913F">?</span>
              <span style="font-size: 12px; font-weight: 700; text-align: center; color: #6E5520">{{ c.name }}</span>
            </div>
          </sc-if>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ isBadges }}" hint-placeholder-val="{{ false }}">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{ badges }}" as="b" hint-placeholder-count="8">
          <div style="background: #FFFFFF; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: {{ b.op }}">
            <span style="width: 56px; height: 56px; border-radius: 50%; background: {{ b.bg }}; display: flex; align-items: center; justify-content: center">
              <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#FFFFFF"></path></svg>
            </span>
            <span style="font-size: 13px; font-weight: 800; text-align: center">{{ b.name }}</span>
            <span style="font-size: 11px; font-weight: 700; color: #5B6661; text-align: center">{{ b.how }}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <nav style="display: flex; justify-content: space-around; align-items: center; background: #FFFFFF; padding: 10px 12px 22px; border-radius: 24px 24px 0 0">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 48px; justify-content: center; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 800">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5B6661" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"></path><path d="M9 4v13M15 7v13"></path></svg>Map</a>
    <a href="QuranLibrary.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 48px; justify-content: center; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 800">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5B6661" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2"></path></svg>Qur'an</a>
    <a href="KoleksiKartu.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 48px; justify-content: center; text-decoration: none; color: #0F6B5C; font-size: 12px; font-weight: 800">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0F6B5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M12 8l1.5 3 3 .4-2.2 2 .6 3-2.9-1.6-2.9 1.6.6-3-2.2-2 3-.4z"></path></svg>My cards</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 'cards' };
}
renderVals() {
const cards = [
['Camel', true, '#CFE7F3', '#D89B4A'], ['Elephant', true, '#E4E0F3', '#8E8AA8'], ['Bee', true, '#FCE7B8', '#E2A54B'], ['Ant', true, '#DCEFE9', '#7A4A2A'],
['Hoopoe', false], ['Whale', false], ['Cow', false], ['Spider', false],
['Horse', false], ['Crow', false], ['Fish', false], ['Sheep', false]
];
const badges = [
['First surah', 'Memorise 1 surah', true, '#0F6B5C'], ['7-day streak', 'Learn 7 days in a row', true, '#E0734F'], ['Letter hero', 'Finish all 28 letters', true, '#5B8DB8'], ['Tajwid expert', 'Pass 8 tajwid rules', false, '#A79FD1'],
['10 surahs', 'Memorise 10 surahs', false, '#3E8E7E'], ['Du\'a friend', 'Learn 6 du\'a', false, '#E2A54B'], ['Story lover', 'Hear 5 stories', false, '#2D3A5C'], ['Khatam Juz \'Amma', 'All 37 surahs', false, '#C98A12']
];
const isCards = this.state.tab === 'cards';
return {
isCards, isBadges: !isCards,
showCards: () => this.setState({ tab: 'cards' }),
showBadges: () => this.setState({ tab: 'badges' }),
cards: cards.map((c) => ({ name: c[0], got: c[1], missing: !c[1], bg: c[2] || '#FFFFFF', fg: c[3] || '#FFFFFF' })),
badges: badges.map((b) => ({ name: b[0], how: b[1], op: b[2] ? 1 : 0.5, bg: b[2] ? b[3] : '#CFC7B5' }))
};
}
}
</script>
</body>
</html>
