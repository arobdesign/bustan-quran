<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Word Memory game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E4F2EC; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; gap: 14px; padding: 48px 18px 24px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="GameList.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800; line-height: 1.1">Word Memory</span>
      <span style="font-size: 12px; font-weight: 700; color: #4F5A55">Words from the Qur'an</span>
    </div>
    <span style="font-size: 14px; font-weight: 800; background: #FFFFFF; border-radius: 999px; padding: 8px 12px">{{ pairs }}/6</span>
  </div>
  <p style="margin: 0; text-align: center; font-size: 15px; font-weight: 800">Match each word with its picture</p>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; flex-grow: 1; align-content: start">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="12">
      <button type="button" onClick="{{ c.flip }}" aria-label="{{ c.aria }}" style="height: 132px; border-radius: 18px; border: none; padding: 0; cursor: pointer; background: transparent">
        <sc-if value="{{ c.hidden }}" hint-placeholder-val="{{ true }}">
          <span style="display: flex; width: 100%; height: 100%; border-radius: 18px; background: #0F6B5C; align-items: center; justify-content: center; box-shadow: 0 4px 0 #0A4F44">
            <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 L24 16 L36 20 L24 24 L20 36 L16 24 L4 20 L16 16 Z" fill="#F2B33D"></path></svg>
          </span>
        </sc-if>
        <sc-if value="{{ c.showWord }}" hint-placeholder-val="{{ false }}">
          <span style="display: flex; flex-direction: column; width: 100%; height: 100%; border-radius: 18px; background: #FFFFFF; align-items: center; justify-content: center; box-shadow: {{ c.ring }}">
            <span lang="ar" style="font-family: 'Amiri Quran', serif; font-size: 34px; line-height: 1.6; color: #23302C">{{ c.word }}</span>
          </span>
        </sc-if>
        <sc-if value="{{ c.showPic }}" hint-placeholder-val="{{ false }}">
          <span style="display: flex; flex-direction: column; gap: 6px; width: 100%; height: 100%; border-radius: 18px; background: #FFFFFF; align-items: center; justify-content: center; box-shadow: {{ c.ring }}">
            <sc-if value="{{ c.isSun }}"><svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="13" fill="#F2B33D"></circle><path d="M27 4v7M27 43v7M4 27h7M43 27h7M11 11l5 5M38 38l5 5M43 11l-5 5M16 38l-5 5" stroke="#F2B33D" stroke-width="4" stroke-linecap="round"></path></svg></sc-if>
            <sc-if value="{{ c.isMoon }}"><svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><path d="M36 8 A20 20 0 1 0 46 38 A16 16 0 1 1 36 8 Z" fill="#A79FD1"></path></svg></sc-if>
            <sc-if value="{{ c.isWater }}"><svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><path d="M27 6 C20 20 14 26 14 34 a13 13 0 0 0 26 0 C40 26 34 20 27 6 Z" fill="#5B8DB8"></path></svg></sc-if>
            <sc-if value="{{ c.isMountain }}"><svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><path d="M4 46 L22 14 L32 30 L38 22 L50 46 Z" fill="#8C7A5B"></path><path d="M18 21 L22 14 L26 21 Z" fill="#FFFFFF"></path></svg></sc-if>
            <sc-if value="{{ c.isStar }}"><svg width="54" height="54" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#F2B33D"></path></svg></sc-if>
            <sc-if value="{{ c.isTree }}"><svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="20" r="15" fill="#3E8E7E"></circle><rect x="24" y="30" width="6" height="18" rx="2" fill="#8C6A3F"></rect></svg></sc-if>
            <span style="font-size: 12px; font-weight: 800; color: #4F5A55">{{ c.en }}</span>
          </span>
        </sc-if>
      </button>
    </sc-for>
  </div>
  <p style="margin: 0; text-align: center; font-size: 13px; font-weight: 700; color: #4F5A55">Tap a card to hear the word</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: [], matched: [] };
}
componentWillUnmount() {
if (this.t) clearTimeout(this.t);
}
flip(i, deck) {
const s = this.state;
if (s.matched.indexOf(deck[i].pair) !== -1 || s.open.indexOf(i) !== -1 || s.open.length === 2) return;
const open = s.open.concat([i]);
if (open.length < 2) { this.setState({ open }); return; }
const same = deck[open[0]].pair === deck[open[1]].pair;
this.setState({ open, matched: same ? s.matched.concat([deck[i].pair]) : s.matched });
this.t = setTimeout(() => this.setState({ open: [] }), same ? 300 : 900);
}
renderVals() {
const words = {
sun: { ar: 'شَمْس', en: 'sun' }, moon: { ar: 'قَمَر', en: 'moon' }, water: { ar: 'مَاء', en: 'water' },
mountain: { ar: 'جَبَل', en: 'mountain' }, star: { ar: 'نَجْم', en: 'star' }, tree: { ar: 'شَجَر', en: 'tree' }
};
const order = [['sun', 'w'], ['tree', 'p'], ['moon', 'w'], ['water', 'p'], ['star', 'w'], ['sun', 'p'], ['mountain', 'w'], ['moon', 'p'], ['tree', 'w'], ['star', 'p'], ['water', 'w'], ['mountain', 'p']];
const deck = order.map((o) => ({ pair: o[0], kind: o[1] }));
const s = this.state;
return {
pairs: s.matched.length,
cards: deck.map((d, i) => {
const done = s.matched.indexOf(d.pair) !== -1;
const shown = done || s.open.indexOf(i) !== -1;
const w = words[d.pair];
return {
hidden: !shown,
showWord: shown && d.kind === 'w',
showPic: shown && d.kind === 'p',
word: w.ar, en: w.en,
ring: done ? 'inset 0 0 0 3px #0F6B5C' : 'inset 0 0 0 3px #F2B33D',
isSun: d.pair === 'sun', isMoon: d.pair === 'moon', isWater: d.pair === 'water', isMountain: d.pair === 'mountain', isStar: d.pair === 'star', isTree: d.pair === 'tree',
aria: shown ? (d.kind === 'w' ? 'Word ' + w.en : 'Picture of ' + w.en) : 'Hidden card ' + (i + 1),
flip: () => this.flip(i, deck)
};
})
};
}
}
</script>
</body>
</html>
