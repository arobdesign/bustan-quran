<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hafalan map and daily review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EC; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; gap: 14px; padding: 48px 18px 20px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="QuranLibrary.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #EADFC8">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800">My hafalan</h1>
  </div>

  <div style="background: #0F6B5C; color: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 19px; font-weight: 800">Today's review box</span>
      <span style="font-size: 12px; font-weight: 800; background: #0A5A4D; border-radius: 999px; padding: 4px 10px">1 of 3 done</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; background: #0A5A4D; border-radius: 14px; padding: 10px 12px; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2B33D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
      <span style="font-size: 14px; font-weight: 700; flex-grow: 1">Listen and repeat An-Nas</span>
    </div>
    <a href="SambungAyat.dc.html" style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; color: #23302C; border-radius: 14px; padding: 10px 12px; min-height: 44px; text-decoration: none">
      <span style="width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid #0F6B5C; box-sizing: border-box"></span>
      <span style="font-size: 14px; font-weight: 800; flex-grow: 1">Continue the ayah · Al-Kawthar</span>
      <span style="font-size: 12px; font-weight: 800; color: #0F6B5C">Start ›</span>
    </a>
    <a href="SusunAyat.dc.html" style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; color: #23302C; border-radius: 14px; padding: 10px 12px; min-height: 44px; text-decoration: none">
      <span style="width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid #0F6B5C; box-sizing: border-box"></span>
      <span style="font-size: 14px; font-weight: 800; flex-grow: 1">Build the ayah · Al-'Asr</span>
      <span style="font-size: 12px; font-weight: 800; color: #0F6B5C">Start ›</span>
    </a>
  </div>

  <div style="background: #FFFFFF; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 15px; font-weight: 800">Juz 'Amma · 37 surahs</span>
      <span style="font-size: 12px; font-weight: 700; color: #5B6661">Surah 78 to 114</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{ cells }}" as="c" hint-placeholder-count="37">
        <sc-if value="{{ c.done }}" hint-placeholder-val="{{ false }}"><span style="height: 38px; border-radius: 10px; background: #0F6B5C; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ c.n }}</span></sc-if>
        <sc-if value="{{ c.review }}" hint-placeholder-val="{{ false }}"><span style="height: 38px; border-radius: 10px; background: #F7D3C5; color: #8F3A1C; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 2px #E0734F">{{ c.n }}</span></sc-if>
        <sc-if value="{{ c.prog }}" hint-placeholder-val="{{ false }}"><span style="height: 38px; border-radius: 10px; background: #FCE7B8; color: #6E4708; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ c.n }}</span></sc-if>
        <sc-if value="{{ c.none }}" hint-placeholder-val="{{ true }}"><span style="height: 38px; border-radius: 10px; background: #F1ECE0; color: #5B6661; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ c.n }}</span></sc-if>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; font-weight: 700; color: #5B6661">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #0F6B5C"></span>Memorised</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #F7D3C5; box-shadow: inset 0 0 0 2px #E0734F"></span>Needs review</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #FCE7B8"></span>Learning</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #F1ECE0"></span>Not yet</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const done = [114, 113, 110, 109, 105, 104, 103];
const review = [108, 103];
const prog = [112, 106];
const cells = [];
for (let n = 114; n >= 78; n--) {
const isReview = review.indexOf(n) !== -1;
const isDone = !isReview && done.indexOf(n) !== -1;
const isProg = prog.indexOf(n) !== -1;
cells.push({ n, done: isDone, review: isReview, prog: isProg, none: !isDone && !isReview && !isProg });
}
return { cells };
}
}
</script>
</body>
</html>
