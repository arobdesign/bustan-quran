<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Surah list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EC; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 48px 18px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 26px; font-weight: 800">My Qur'an</h1>
      <a href="HafalanMap.dc.html" style="min-height: 40px; padding: 0 14px; border-radius: 999px; background: #0F6B5C; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; text-decoration: none">My hafalan map</a>
    </div>
    <label for="find" style="position: absolute; left: -9999px">Find a surah</label>
    <div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 14px; padding: 0 14px; min-height: 48px; box-shadow: 0 2px 0 #EADFC8">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6661" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="find" type="text" placeholder="Find a surah" style="border: none; outline: none; background: transparent; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: #23302C; flex-grow: 1">
    </div>
    <div role="tablist" style="display: flex; gap: 8px">
      <button type="button" role="tab" aria-selected="true" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #23302C; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; cursor: pointer">Juz 'Amma</button>
      <button type="button" role="tab" aria-selected="false" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #FFFFFF; color: #23302C; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; cursor: pointer">All 30 juz</button>
      <button type="button" role="tab" aria-selected="false" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #FFFFFF; color: #23302C; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; cursor: pointer">Downloaded</button>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 0 18px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <sc-for list="{{ surahs }}" as="s" hint-placeholder-count="10">
      <a href="{{ s.href }}" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 16px; padding: 8px 12px; min-height: 48px; text-decoration: none; color: #23302C">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #DCEFE9; color: #0A4F44; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{ s.no }}</span>
        <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 800">{{ s.name }}</span><span style="font-size: 12px; font-weight: 600; color: #5B6661">{{ s.ayat }} ayat</span></span>
        <sc-if value="{{ s.done }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 800; color: #0A4F44; background: #DCEFE9; border-radius: 999px; padding: 3px 8px">Memorised</span></sc-if>
        <sc-if value="{{ s.prog }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 800; color: #8A5A10; background: #FCE7B8; border-radius: 999px; padding: 3px 8px">Learning</span></sc-if>
        <span lang="ar" style="font-family: 'Amiri Quran', serif; font-size: 20px; color: #0F6B5C; min-width: 64px; text-align: right">{{ s.ar }}</span>
      </a>
    </sc-for>
  </div>

  <nav style="display: flex; justify-content: space-around; align-items: center; background: #FFFFFF; padding: 10px 12px 22px; border-radius: 24px 24px 0 0; margin-top: 8px">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 48px; justify-content: center; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 800">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5B6661" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"></path><path d="M9 4v13M15 7v13"></path></svg>Map</a>
    <a href="QuranLibrary.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 48px; justify-content: center; text-decoration: none; color: #0F6B5C; font-size: 12px; font-weight: 800">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0F6B5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2"></path></svg>Qur'an</a>
    <a href="KoleksiKartu.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 48px; justify-content: center; text-decoration: none; color: #5B6661; font-size: 12px; font-weight: 800">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5B6661" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M12 8l1.5 3 3 .4-2.2 2 .6 3-2.9-1.6-2.9 1.6.6-3-2.2-2 3-.4z"></path></svg>My cards</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const list = [
[114, 'An-Nas', 6, 'النَّاس', 'done'],
[113, 'Al-Falaq', 5, 'الفَلَق', 'done'],
[112, 'Al-Ikhlas', 4, 'الإِخْلَاص', 'prog'],
[111, 'Al-Masad', 5, 'المَسَد', ''],
[110, 'An-Nasr', 3, 'النَّصْر', 'done'],
[109, 'Al-Kafirun', 6, 'الكَافِرُون', ''],
[108, 'Al-Kawthar', 3, 'الكَوْثَر', 'done'],
[107, "Al-Ma'un", 7, 'المَاعُون', ''],
[106, 'Quraysh', 4, 'قُرَيْش', 'prog'],
[105, 'Al-Fil', 5, 'الفِيل', '']
];
return {
surahs: list.map((r) => ({
no: r[0], name: r[1], ayat: r[2], ar: r[3],
done: r[4] === 'done', prog: r[4] === 'prog',
href: r[0] === 112 ? 'Hafalan.dc.html' : 'MurottalQuraisy.dc.html'
}))
};
}
}
</script>
</body>
</html>
