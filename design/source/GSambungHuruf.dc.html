<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join the Letters game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Amiri:wght@700&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E4F2EC; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; gap: 18px; padding: 48px 18px 28px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="GameList.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800">Join the Letters</span>
    <span style="font-size: 13px; font-weight: 800; background: #FFFFFF; border-radius: 999px; padding: 8px 12px">2 / 6</span>
  </div>
  <p style="margin: 0; font-size: 16px; font-weight: 800; text-align: center">Tap the letters in order to make a word</p>

  <div dir="rtl" lang="ar" style="display: flex; justify-content: center; gap: 12px">
    <sc-for list="{{ parts }}" as="p" hint-placeholder-count="3">
      <button type="button" onClick="{{ p.tap }}" style="width: 90px; height: 100px; border-radius: 20px; border: none; background: {{ p.bg }}; box-shadow: 0 4px 0 #9ED3B5; font-family: 'Amiri', serif; font-size: 56px; font-weight: 700; color: #23302C; cursor: pointer">{{ p.g }}</button>
    </sc-for>
  </div>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0F6B5C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="align-self: center"><path d="M12 4v16M6 14l6 6 6-6"></path></svg>

  <div style="background: #FFFFFF; border-radius: 26px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 200px; justify-content: center">
    <span dir="rtl" lang="ar" style="font-family: 'Amiri Quran', serif; font-size: 72px; line-height: 1.5; color: #0F6B5C">{{ word }}</span>
    <sc-if value="{{ full }}" hint-placeholder-val="{{ false }}">
      <span style="display: flex; align-items: center; gap: 10px">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="8" y="4" width="24" height="34" rx="3" fill="#B88B52"></rect><circle cx="27" cy="22" r="2" fill="#23302C"></circle></svg>
        <span style="font-size: 18px; font-weight: 800">baab · a door</span>
      </span>
    </sc-if>
  </div>
  <div style="flex-grow: 1"></div>
  <button type="button" onClick="{{ reset }}" style="min-height: 52px; border-radius: 999px; border: 2px solid #0F6B5C; background: #FFFFFF; color: #0F6B5C; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Start again</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { n: 0 }; }
renderVals() {
const n = this.state.n;
const words = ['', 'بـ', 'بَا', 'بَاب'];
const G = ['ب', 'ا', 'ب'];
return {
word: n === 0 ? '…' : words[n],
full: n === 3,
reset: () => this.setState({ n: 0 }),
parts: G.map((g, i) => ({ g, bg: i < n ? '#9ED3B5' : '#FFFFFF', tap: () => { if (i === n) this.setState({ n: n + 1 }); } }))
};
}
}
</script>
</body>
</html>
