<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Surah Train game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #DDF0F8; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 48px 18px 10px">
    <a href="GameList.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; flex-direction: column; align-items: center"><span style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800; line-height: 1.1">Surah Train</span><span style="font-size: 12px; font-weight: 700; color: #4F5A55">Al-Fatihah · 7 carriages</span></div>
    <span style="width: 48px"></span>
  </div>
  <p style="margin: 10px 20px 0; background: #FFFFFF; border-radius: 20px; padding: 12px 16px; font-size: 16px; font-weight: 800; text-align: center">Tap each carriage to hear one ayah</p>
  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px; padding: 0 12px">
    <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
      <div aria-hidden="true" style="width: 84px; height: 84px; border-radius: 18px 30px 12px 12px; background: #E0734F; display: flex; align-items: center; justify-content: center"><span style="width: 30px; height: 30px; border-radius: 8px; background: #FFFFFF"></span></div>
      <sc-for list="{{ cars }}" as="c" hint-placeholder-count="7">
        <button type="button" onClick="{{ c.play }}" aria-label="{{ c.label }}" style="width: 84px; height: 84px; border-radius: 14px; border: none; background: {{ c.bg }}; box-shadow: {{ c.ring }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: 'Nunito', sans-serif; color: #23302C; cursor: pointer">
          <span style="font-size: 11px; font-weight: 800">Ayah</span>
          <span style="font-family: 'Baloo 2', sans-serif; font-size: 28px; font-weight: 800; line-height: 1">{{ c.n }}</span>
        </button>
      </sc-for>
    </div>
    <div aria-hidden="true" style="height: 8px; border-radius: 999px; background: #8C7A5B; margin: 0 10px"></div>
  </div>
  <div style="margin: 0 20px 32px; background: #0F6B5C; color: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="#FFFFFF"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
    <span style="font-size: 15px; font-weight: 800">{{ now }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { cur: 0 }; }
renderVals() {
const c = this.state.cur;
const colors = ['#F2B33D', '#9ED3B5', '#A79FD1', '#F7D3C5', '#8FCBE0', '#FCE7B8', '#F4B9A2'];
return {
now: 'Now playing: Ayah ' + (c + 1) + ' of 7',
cars: colors.map((bg, i) => ({ n: i + 1, bg, label: 'Play ayah ' + (i + 1), ring: c === i ? '0 0 0 4px #0F6B5C' : 'none', play: () => this.setState({ cur: i }) }))
};
}
}
</script>
</body>
</html>
