<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio downloads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; gap: 12px; padding: 48px 18px 20px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Settings.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800">Audio downloads</h1>
  </div>

  <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 800"><span>Phone storage</span><span>[used] of [free] used by the app</span></div>
    <div style="height: 10px; border-radius: 999px; background: #E8EEEC; overflow: hidden; display: flex"><div style="width: 14%; background: #0F6B5C"></div><div style="width: 50%; background: #CFC7B5"></div></div>
    <span style="font-size: 12px; font-weight: 600; color: #5B6661">Reciter: Child voice · boy · downloads on Wi-Fi only</span>
  </div>

  <div style="background: #FFFFFF; border-radius: 18px; padding: 2px 14px; display: flex; flex-direction: column">
    <sc-for list="{{ juz }}" as="j" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 58px; border-bottom: 1px solid #EEE8DA">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #DCEFE9; color: #0A4F44; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{ j.n }}</span>
        <span style="display: flex; flex-direction: column; flex-grow: 1; gap: 4px">
          <span style="font-size: 14px; font-weight: 800">{{ j.name }}</span>
          <sc-if value="{{ j.loading }}" hint-placeholder-val="{{ false }}"><span style="height: 6px; border-radius: 999px; background: #E8EEEC; overflow: hidden; display: block"><span style="display: block; width: 45%; height: 100%; background: #F2B33D"></span></span></sc-if>
          <span style="font-size: 12px; font-weight: 600; color: #5B6661">{{ j.note }}</span>
        </span>
        <sc-if value="{{ j.done }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 800; color: #0A4F44; background: #DCEFE9; border-radius: 999px; padding: 4px 10px">On phone</span></sc-if>
        <sc-if value="{{ j.loading }}" hint-placeholder-val="{{ false }}"><button type="button" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 2px solid #E3D8C1; background: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800; color: #23302C; cursor: pointer">Pause</button></sc-if>
        <sc-if value="{{ j.todo }}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="Download" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #0F6B5C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button></sc-if>
      </div>
    </sc-for>
  </div>
  <button type="button" style="min-height: 52px; border-radius: 999px; border: none; background: #0F6B5C; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Download all 30 juz</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
[30, "Juz 'Amma", 'done'], [29, 'Tabarak', 'loading'], [28, "Qad Sami'a", 'todo'], [27, "Qala fa ma khatbukum", 'todo'], [26, 'Ha Mim', 'todo'], [25, 'Ilayhi yuraddu', 'todo'], [24, 'Fa man azlamu', 'todo']
];
return { juz: rows.map((r) => ({ n: r[0], name: 'Juz ' + r[0] + ' · ' + r[1], done: r[2] === 'done', loading: r[2] === 'loading', todo: r[2] === 'todo', note: r[2] === 'done' ? '[size] · ready offline' : (r[2] === 'loading' ? 'Downloading · 45%' : '[size]') })) };
}
}
</script>
</body>
</html>
