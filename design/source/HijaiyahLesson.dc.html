<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Letter lesson Jim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Amiri+Quran&amp;family=Amiri:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EC; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; gap: 14px; padding: 48px 18px 24px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="GameList.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #EADFC8">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800; line-height: 1.1">Letter 5 · Jim</span>
      <span style="font-size: 12px; font-weight: 700; color: #5B6661">Qaida lesson 1</span>
    </div>
    <span style="font-size: 13px; font-weight: 800; background: #FFFFFF; border-radius: 999px; padding: 8px 12px">5 / 28</span>
  </div>

  <div style="background: #FFFFFF; border-radius: 28px; height: 330px; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #EADFC8; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 50%; border-top: 2px dashed #EADFC8"></div>
    <span aria-hidden="true" lang="ar" style="font-family: 'Amiri', serif; font-size: 230px; line-height: 1; color: #EFE6D2; position: absolute">{{ big }}</span>
    <span lang="ar" style="font-family: 'Amiri', serif; font-size: 230px; line-height: 1; color: transparent; -webkit-text-stroke: 3px #0F6B5C; position: absolute">{{ big }}</span>
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="position: absolute; left: 96px; top: 96px"><circle cx="20" cy="20" r="14" fill="#F2B33D"></circle><text x="20" y="25" text-anchor="middle" font-size="14" font-weight="800" fill="#23302C" font-family="Nunito">1</text></svg>
    <span style="position: absolute; bottom: 14px; font-size: 13px; font-weight: 800; color: #5B6661">Trace with your finger, starting at the yellow dot</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 800">Jim changes shape in a word</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ forms }}" as="f" hint-placeholder-count="4">
        <sc-if value="{{ f.sel }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ f.pick }}" aria-pressed="true" style="min-height: 76px; border-radius: 16px; border: 3px solid #0F6B5C; background: #DCEFE9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; cursor: pointer; font-family: 'Nunito', sans-serif; color: #23302C"><span lang="ar" style="font-family: 'Amiri', serif; font-size: 34px; line-height: 1.2">{{ f.glyph }}</span><span style="font-size: 11px; font-weight: 800">{{ f.label }}</span></button>
        </sc-if>
        <sc-if value="{{ f.unsel }}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{ f.pick }}" aria-pressed="false" style="min-height: 76px; border-radius: 16px; border: 2px solid #E3D8C1; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; cursor: pointer; font-family: 'Nunito', sans-serif; color: #23302C"><span lang="ar" style="font-family: 'Amiri', serif; font-size: 34px; line-height: 1.2">{{ f.glyph }}</span><span style="font-size: 11px; font-weight: 800; color: #5B6661">{{ f.label }}</span></button>
        </sc-if>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; gap: 10px; align-items: stretch">
    <div style="flex-grow: 1; background: #FFFFFF; border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 12px">
      <span lang="ar" style="font-family: 'Amiri Quran', serif; font-size: 30px; color: #0F6B5C">جَبَل</span>
      <span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 800">jabal · mountain</span><span style="font-size: 12px; font-weight: 600; color: #5B6661">Sound comes from the middle of the tongue</span></span>
    </div>
    <button type="button" aria-label="Hear Jim" style="width: 64px; border-radius: 18px; border: none; background: #0F6B5C; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="#FFFFFF"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
    </button>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="display: flex; gap: 10px">
    <button type="button" style="flex: 1; min-height: 54px; border-radius: 999px; border: 2px solid #E0734F; background: #FFFFFF; color: #B4532F; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Say it · record</button>
    <a href="Reward.dc.html" style="flex: 1; min-height: 54px; border-radius: 999px; background: #0F6B5C; color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Next letter</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { form: 0 };
}
renderVals() {
const forms = [
{ glyph: 'ج', label: 'Alone' },
{ glyph: 'جـ', label: 'Start' },
{ glyph: 'ـجـ', label: 'Middle' },
{ glyph: 'ـج', label: 'End' }
];
return {
big: forms[this.state.form].glyph,
forms: forms.map((f, i) => ({ glyph: f.glyph, label: f.label, sel: this.state.form === i, unsel: this.state.form !== i, pick: () => this.setState({ form: i }) }))
};
}
}
</script>
</body>
</html>
