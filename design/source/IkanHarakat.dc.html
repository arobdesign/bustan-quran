<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harakat Fishing game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8FCBE0; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 48px 18px 10px">
    <a href="GameList.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 14px; font-weight: 800; background: #FFFFFF; border-radius: 999px; padding: 8px 14px">Fish caught: {{ caught }}</span>
  </div>

  <div style="margin: 6px 18px 0; background: #FFFFFF; border-radius: 26px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
    <button type="button" aria-label="Hear the sound again" style="width: 60px; height: 60px; border-radius: 50%; border: none; background: #0F6B5C; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="#FFFFFF"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column">
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 22px; font-weight: 800; line-height: 1.15">Catch "bi"</span>
      <span style="font-size: 13px; font-weight: 700; color: #4F5A55">{{ hint }}</span>
    </div>
  </div>

  <div style="position: relative; flex-grow: 1; margin-top: 20px; background: #5FAFCB; border-radius: 48px 48px 0 0">
    <svg width="390" height="40" viewBox="0 0 390 40" aria-hidden="true" style="position: absolute; top: -18px; left: 0"><path d="M0 22 Q32 6 65 22 T130 22 T195 22 T260 22 T325 22 T390 22 V40 H0 Z" fill="#5FAFCB"></path></svg>
    <sc-for list="{{ fish }}" as="f" hint-placeholder-count="3">
      <button type="button" onClick="{{ f.pick }}" aria-label="{{ f.label }}" style="position: absolute; left: {{ f.x }}px; top: {{ f.y }}px; width: 150px; height: 96px; border: none; background: transparent; padding: 0; cursor: pointer">
        <svg width="150" height="96" viewBox="0 0 150 96" aria-hidden="true" style="position: absolute; left: 0; top: 0"><ellipse cx="66" cy="48" rx="58" ry="38" fill="{{ f.color }}"></ellipse><path d="M118 48 L148 20 L148 76 Z" fill="{{ f.color }}"></path><circle cx="30" cy="40" r="6" fill="#FFFFFF"></circle><circle cx="30" cy="40" r="3" fill="#23302C"></circle></svg>
        <span lang="ar" style="position: absolute; left: 44px; top: 4px; width: 60px; text-align: center; font-family: 'Amiri Quran', serif; font-size: 46px; line-height: 1.6; color: #23302C">{{ f.g }}</span>
      </button>
    </sc-for>
    <div aria-hidden="true" style="position: absolute; bottom: 0; left: 0; right: 0; height: 70px; background: #F6D58E; border-radius: 40px 40px 0 0"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { caught: 0, last: null };
}
renderVals() {
const s = this.state;
const fish = [
{ g: 'بَ', name: 'ba', x: 30, y: 60, color: '#F2B33D' },
{ g: 'بِ', name: 'bi', x: 200, y: 190, color: '#E0734F' },
{ g: 'بُ', name: 'bu', x: 50, y: 330, color: '#A79FD1' }
];
const hint = s.last === null ? 'Kasrah is the little line below the letter' : (s.last === 'bi' ? 'MashaAllah! You caught bi.' : 'That one says ' + s.last + '. Look for the line below.');
return {
caught: s.caught,
hint,
fish: fish.map((f) => ({ ...f, label: 'Fish with ' + f.name, pick: () => this.setState({ last: f.name, caught: f.name === 'bi' ? s.caught + 1 : s.caught }) }))
};
}
}
</script>
</body>
</html>
