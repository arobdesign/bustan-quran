<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pillars of Islam and Iman</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EC; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; gap: 12px; padding: 48px 18px 20px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Home.dc.html" aria-label="Back to map" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #EADFC8"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800">My deen</h1>
  </div>
  <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #EFE7D6; border-radius: 999px; padding: 4px">
    <button type="button" role="tab" aria-selected="{{ islamSel }}" onClick="{{ showIslam }}" style="min-height: 44px; border: none; border-radius: 999px; background: {{ islamBg }}; color: {{ islamInk }}; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; cursor: pointer">5 Pillars of Islam</button>
    <button type="button" role="tab" aria-selected="{{ imanSel }}" onClick="{{ showIman }}" style="min-height: 44px; border: none; border-radius: 999px; background: {{ imanBg }}; color: {{ imanInk }}; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; cursor: pointer">6 Pillars of Iman</button>
  </div>
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 10px 14px; min-height: 52px; box-shadow: 0 2px 0 #EADFC8">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: {{ it.bg }}; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', sans-serif; font-size: 18px; font-weight: 800; flex-shrink: 0">{{ it.n }}</span>
      <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 800">{{ it.t }}</span><span style="font-size: 12px; font-weight: 600; color: #5B6661">{{ it.d }}</span></span>
    </div>
  </sc-for>
  <div style="flex-grow: 1"></div>
  <div style="display: flex; gap: 10px">
    <a href="WudhuGuide.dc.html" style="flex: 1; min-height: 52px; border-radius: 999px; background: #1F4E79; color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Learn wudu</a>
    <a href="SalatGuide.dc.html" style="flex: 1; min-height: 52px; border-radius: 999px; background: #0F6B5C; color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Learn salah</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 'islam' }; }
renderVals() {
const islam = [['Shahadah', 'Believe and say there is no god but Allah'], ['Salah', 'Pray five times a day'], ['Zakah', 'Share with people in need'], ['Sawm', 'Fast in Ramadan'], ['Hajj', 'Visit the Ka\'bah once, if you can']];
const iman = [['Allah', 'Believe in Allah, the One'], ['Angels', 'Believe in the angels'], ['Books', 'Believe in Allah\'s books'], ['Messengers', 'Believe in all the prophets'], ['Last Day', 'Believe in the Day of Judgement'], ['Qadr', 'Believe Allah knows and plans all things']];
const isI = this.state.tab === 'islam';
const colors = ['#FCE7B8', '#DCEFE9', '#D7E8F5', '#F7D3C5', '#E4E0F3', '#FCE7B8'];
return {
islamSel: isI ? 'true' : 'false', imanSel: isI ? 'false' : 'true',
islamBg: isI ? '#0F6B5C' : 'transparent', islamInk: isI ? '#FFFFFF' : '#23302C',
imanBg: isI ? 'transparent' : '#0F6B5C', imanInk: isI ? '#23302C' : '#FFFFFF',
showIslam: () => this.setState({ tab: 'islam' }), showIman: () => this.setState({ tab: 'iman' }),
items: (isI ? islam : iman).map((x, i) => ({ n: i + 1, t: x[0], d: x[1], bg: colors[i] }))
};
}
}
</script>
</body>
</html>
