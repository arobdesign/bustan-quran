<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guess the Surah game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2D3A5C; font-family: 'Nunito', sans-serif; color: #FFFFFF; display: flex; flex-direction: column; gap: 18px; padding: 48px 18px 28px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="GameList.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 16px; background: #3B4A72; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800">Guess the Surah</span>
    <span style="font-size: 13px; font-weight: 800; background: #3B4A72; border-radius: 999px; padding: 8px 12px">3 / 5</span>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 0">
    <button type="button" aria-label="Play the first 3 seconds" style="width: 128px; height: 128px; border-radius: 50%; border: 8px solid #3B4A72; background: #F2B33D; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="#23302C"></path></svg>
    </button>
    <span style="font-size: 16px; font-weight: 800">Listen to the first 3 seconds</span>
    <div aria-hidden="true" style="display: flex; gap: 4px; align-items: flex-end; height: 30px"><span style="width: 6px; height: 12px; background: #F2B33D; border-radius: 3px"></span><span style="width: 6px; height: 26px; background: #F2B33D; border-radius: 3px"></span><span style="width: 6px; height: 18px; background: #F2B33D; border-radius: 3px"></span><span style="width: 6px; height: 30px; background: #F2B33D; border-radius: 3px"></span><span style="width: 6px; height: 14px; background: #F2B33D; border-radius: 3px"></span><span style="width: 6px; height: 22px; background: #F2B33D; border-radius: 3px"></span></div>
  </div>
  <span style="font-size: 15px; font-weight: 800; text-align: center">Which surah is it?</span>
  <sc-for list="{{ opts }}" as="o" hint-placeholder-count="3">
    <button type="button" onClick="{{ o.pick }}" style="display: flex; align-items: center; justify-content: space-between; min-height: 66px; border-radius: 18px; border: {{ o.border }}; background: {{ o.bg }}; padding: 0 18px; font-family: 'Nunito', sans-serif; color: #23302C; cursor: pointer">
      <span style="font-size: 17px; font-weight: 800">{{ o.en }}</span>
      <span lang="ar" style="font-family: 'Amiri Quran', serif; font-size: 24px; color: #0F6B5C">{{ o.ar }}</span>
    </button>
  </sc-for>
  <p style="margin: 0; text-align: center; font-size: 14px; font-weight: 800; color: #D8DEF0">{{ msg }}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { p: null }; }
renderVals() {
const p = this.state.p;
const o = [{ en: 'An-Nas', ar: 'النَّاس', ok: false }, { en: 'Al-Falaq', ar: 'الفَلَق', ok: true }, { en: 'Al-Ikhlas', ar: 'الإِخْلَاص', ok: false }];
return {
msg: p === null ? '' : (o[p].ok ? 'Yes! It starts with "Qul a\'udhu bi rabbil-falaq".' : 'Close! Listen once more.'),
opts: o.map((x, i) => ({ en: x.en, ar: x.ar, border: p === i ? (x.ok ? '3px solid #3E8E7E' : '3px solid #E0734F') : 'none', bg: p === i ? (x.ok ? '#DCEFE9' : '#FBE3D9') : '#FFFFFF', pick: () => this.setState({ p: i }) }))
};
}
}
</script>
</body>
</html>
