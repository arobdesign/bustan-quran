<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Salah guide</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EC; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; gap: 14px; padding: 48px 18px 24px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="RukunIslam.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #EADFC8"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800">How to pray</span>
    <span style="font-size: 13px; font-weight: 800; background: #FFFFFF; border-radius: 999px; padding: 8px 12px">{{ no }}/9</span>
  </div>
  <div style="background: #0F6B5C; color: #FFFFFF; border-radius: 26px; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 250px; justify-content: center">
    <span style="font-size: 12px; font-weight: 800; color: #CDE7DF; letter-spacing: 0.06em">STEP {{ no }}</span>
    <span style="font-family: 'Baloo 2', sans-serif; font-size: 28px; font-weight: 800; text-align: center; line-height: 1.15">{{ step.t }}</span>
    <span dir="rtl" lang="ar" style="font-family: 'Amiri Quran', serif; font-size: 30px; line-height: 1.8">{{ step.ar }}</span>
    <span style="font-size: 14px; font-weight: 700; color: #DCEFE9; text-align: center">{{ step.d }}</span>
    <button type="button" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #F2B33D; color: #23302C; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; cursor: pointer">Listen</button>
  </div>
  <div style="display: flex; gap: 10px">
    <button type="button" onClick="{{ prev }}" style="flex: 1; min-height: 52px; border-radius: 999px; border: 2px solid #0F6B5C; background: #FFFFFF; color: #0F6B5C; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Back</button>
    <button type="button" onClick="{{ next }}" style="flex: 1; min-height: 52px; border-radius: 999px; border: none; background: #0F6B5C; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Next step</button>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center">
    <sc-for list="{{ dots }}" as="d" hint-placeholder-count="9">
      <span style="width: 28px; height: 8px; border-radius: 999px; background: {{ d.c }}"></span>
    </sc-for>
  </div>
  <p style="margin: 0; font-size: 12px; font-weight: 600; color: #5B6661; text-align: center">Shown simply for children. Families can follow their own madhhab; ask your local imam for details.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 1 }; }
renderVals() {
const S = [
{ t: 'Face the Qiblah', ar: '', d: 'Stand calmly and make the intention in your heart.' },
{ t: 'Takbir', ar: 'اللَّهُ أَكْبَرُ', d: 'Raise your hands and say "Allahu akbar".' },
{ t: 'Stand and recite', ar: 'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ', d: 'Recite Al-Fatihah, then a short surah.' },
{ t: "Ruku'", ar: 'سُبْحَانَ رَبِّيَ الْعَظِيمِ', d: 'Bow with your back straight.' },
{ t: 'Stand up again', ar: 'سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ', d: 'Rise up and stand straight.' },
{ t: 'Sujud', ar: 'سُبْحَانَ رَبِّيَ الْأَعْلَى', d: 'Put your forehead on the ground, twice.' },
{ t: 'Sit', ar: '', d: 'Sit calmly between the two sujud.' },
{ t: 'Tashahhud', ar: 'التَّحِيَّاتُ لِلَّهِ', d: 'Sit and recite the tashahhud.' },
{ t: 'Salam', ar: 'السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ', d: 'Turn your head right, then left.' }
];
const i = this.state.i;
return {
no: i + 1,
step: S[i],
prev: () => this.setState({ i: Math.max(0, i - 1) }),
next: () => this.setState({ i: Math.min(8, i + 1) }),
dots: S.map((s, k) => ({ c: k <= i ? '#0F6B5C' : '#E3D8C1' }))
};
}
}
</script>
</body>
</html>
