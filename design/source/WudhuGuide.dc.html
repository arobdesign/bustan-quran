<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wudu guide</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E3F1F8; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; gap: 14px; padding: 48px 18px 24px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="RukunIslam.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800">How to make wudu</span>
    <span style="font-size: 13px; font-weight: 800; background: #FFFFFF; border-radius: 999px; padding: 8px 12px">{{ stepNo }}/8</span>
  </div>
  <div style="height: 260px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
    <svg width="150" height="130" viewBox="0 0 150 130" aria-hidden="true">
      <path d="M40 20 h70 v18 h-30 v10 h-10 v-10 h-30 z" fill="#8C9AA8"></path>
      <path d="M75 52 C70 66 66 72 66 80 a9 9 0 0 0 18 0 C84 72 80 66 75 52 Z" fill="#5B8DB8"></path>
      <path d="M30 100 Q45 84 60 96 L66 92 Q75 86 84 92 L90 96 Q105 84 120 100 Q100 122 75 118 Q50 122 30 100 Z" fill="#E8B48C"></path>
    </svg>
    <span style="font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800">{{ step.t }}</span>
    <span style="font-size: 15px; font-weight: 700; color: #4F5A55; text-align: center; padding: 0 20px">{{ step.d }}</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{ steps }}" as="s" hint-placeholder-count="8">
      <button type="button" onClick="{{ s.pick }}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; border-radius: 12px; border: none; background: {{ s.bg }}; padding: 0 12px; font-family: 'Nunito', sans-serif; color: #23302C; cursor: pointer; text-align: left">
        <span style="width: 26px; height: 26px; border-radius: 50%; background: {{ s.dot }}; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ s.n }}</span>
        <span style="font-size: 14px; font-weight: 800">{{ s.t }}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 2 }; }
renderVals() {
const S = [
{ t: 'Intention and Bismillah', d: 'Say "Bismillah" quietly and mean to make wudu.' },
{ t: 'Wash both hands', d: 'Wash your hands up to the wrists, three times.' },
{ t: 'Rinse the mouth', d: 'Take water into your mouth and rinse, three times.' },
{ t: 'Rinse the nose', d: 'Breathe in a little water gently and blow it out, three times.' },
{ t: 'Wash the face', d: 'From forehead to chin and ear to ear, three times.' },
{ t: 'Wash the arms', d: 'Right arm then left, up to the elbows, three times.' },
{ t: 'Wipe head and ears', d: 'Wipe over your head with wet hands, then your ears, once.' },
{ t: 'Wash the feet', d: 'Right foot then left, up to the ankles, three times.' }
];
const i = this.state.i;
return {
stepNo: i + 1,
step: S[i],
steps: S.map((s, k) => ({ n: k + 1, t: s.t, bg: k === i ? '#FFFFFF' : 'transparent', dot: k < i ? '#3E8E7E' : (k === i ? '#1F4E79' : '#A9B8C4'), pick: () => this.setState({ i: k }) }))
};
}
}
</script>
</body>
</html>
