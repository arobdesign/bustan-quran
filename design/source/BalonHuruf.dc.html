<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Letter Balloons game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #DDF0F8; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 48px 20px 8px">
    <a href="Home.dc.html" aria-label="Back to map" style="width: 48px; height: 48px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; gap: 8px" aria-label="Round 3 of 5" role="img">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #0F6B5C"></span>
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #0F6B5C"></span>
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #F2B33D; outline: 3px solid #FFFFFF"></span>
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF"></span>
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF"></span>
    </div>
    <span style="font-size: 13px; font-weight: 800; background: #FFFFFF; border-radius: 999px; padding: 8px 12px">Level 1</span>
  </div>

  <div style="margin: 12px 20px 0; background: #FFFFFF; border-radius: 28px; padding: 16px 18px; display: flex; align-items: center; gap: 14px">
    <button type="button" aria-label="Hear the letter again" style="width: 64px; height: 64px; border-radius: 50%; border: none; background: #0F6B5C; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="#FFFFFF"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 22px; font-weight: 800; line-height: 1.15">Pop the letter "Ba"</span>
      <span style="font-size: 13px; font-weight: 700; color: #5B6661">Tap the speaker to hear it again</span>
    </div>
    <div style="width: 60px; height: 60px; border-radius: 18px; background: #FCE7B8; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <span style="font-family: 'Amiri Quran', serif; font-size: 40px; line-height: 1; color: #23302C">ب</span>
    </div>
  </div>

  <div style="position: relative; flex-grow: 1">
    <div aria-hidden="true" style="position: absolute; left: 40px; top: 40px; width: 90px; height: 34px; background: #FFFFFF; border-radius: 999px; opacity: 0.8"></div>
    <div aria-hidden="true" style="position: absolute; right: 30px; top: 120px; width: 70px; height: 26px; background: #FFFFFF; border-radius: 999px; opacity: 0.8"></div>

    <button type="button" aria-label="Balloon with letter Ta" style="position: absolute; left: 30px; top: 110px; width: 96px; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center">
      <div style="width: 96px; height: 116px; border-radius: 50% 50% 48% 48%; background: #E0734F; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Amiri Quran', serif; font-size: 52px; color: #FFFFFF; line-height: 1">ت</span></div>
      <svg width="20" height="70" viewBox="0 0 20 70" aria-hidden="true"><path d="M10 0 Q2 20 10 35 T10 70" stroke="#7D8A85" stroke-width="2" fill="none"></path></svg>
    </button>

    <button type="button" aria-label="Balloon with letter Ba" style="position: absolute; left: 148px; top: 30px; width: 104px; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center">
      <div style="width: 104px; height: 126px; border-radius: 50% 50% 48% 48%; background: #F2B33D; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px #FFFFFF"><span style="font-family: 'Amiri Quran', serif; font-size: 58px; color: #23302C; line-height: 1">ب</span></div>
      <svg width="20" height="80" viewBox="0 0 20 80" aria-hidden="true"><path d="M10 0 Q18 20 10 40 T10 80" stroke="#7D8A85" stroke-width="2" fill="none"></path></svg>
    </button>

    <button type="button" aria-label="Balloon with letter Tha" style="position: absolute; left: 268px; top: 150px; width: 96px; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center">
      <div style="width: 96px; height: 116px; border-radius: 50% 50% 48% 48%; background: #5B8DB8; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Amiri Quran', serif; font-size: 52px; color: #FFFFFF; line-height: 1">ث</span></div>
      <svg width="20" height="70" viewBox="0 0 20 70" aria-hidden="true"><path d="M10 0 Q2 20 10 35 T10 70" stroke="#7D8A85" stroke-width="2" fill="none"></path></svg>
    </button>

    <button type="button" aria-label="Balloon with letter Nun" style="position: absolute; left: 90px; top: 290px; width: 96px; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center">
      <div style="width: 96px; height: 116px; border-radius: 50% 50% 48% 48%; background: #3E8E7E; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Amiri Quran', serif; font-size: 52px; color: #FFFFFF; line-height: 1">ن</span></div>
      <svg width="20" height="60" viewBox="0 0 20 60" aria-hidden="true"><path d="M10 0 Q18 15 10 30 T10 60" stroke="#7D8A85" stroke-width="2" fill="none"></path></svg>
    </button>

    <button type="button" aria-label="Balloon with letter Ya" style="position: absolute; left: 216px; top: 330px; width: 96px; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center">
      <div style="width: 96px; height: 116px; border-radius: 50% 50% 48% 48%; background: #A79FD1; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Amiri Quran', serif; font-size: 52px; color: #FFFFFF; line-height: 1">ي</span></div>
      <svg width="20" height="60" viewBox="0 0 20 60" aria-hidden="true"><path d="M10 0 Q2 15 10 30 T10 60" stroke="#7D8A85" stroke-width="2" fill="none"></path></svg>
    </button>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 10px; padding: 0 20px 28px">
    <svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="Hud-hud the guide bird">
      <ellipse cx="42" cy="52" rx="26" ry="24" fill="#E2A54B"></ellipse>
      <path d="M30 26 L26 10 L36 22 L40 6 L44 22 L54 10 L50 26" fill="#E0734F"></path>
      <circle cx="34" cy="46" r="6" fill="#FFFFFF"></circle><circle cx="34" cy="46" r="3" fill="#23302C"></circle>
      <circle cx="50" cy="46" r="6" fill="#FFFFFF"></circle><circle cx="50" cy="46" r="3" fill="#23302C"></circle>
      <path d="M42 52 L60 56 L42 58 Z" fill="#23302C"></path>
    </svg>
    <div style="background: #FFFFFF; border-radius: 20px 20px 20px 4px; padding: 12px 16px; font-size: 15px; font-weight: 800; margin-bottom: 30px">Ba has one dot below. Can you find it?</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
