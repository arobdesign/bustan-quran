<style>

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F6B5C; font-family: 'Nunito', sans-serif; color: #23302C; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 48px 18px 16px; gap: 10px">
    <a href="Home.dc.html" aria-label="Back to map" style="width: 48px; height: 48px; border-radius: 16px; background: #0A5A4D; display: flex; align-items: center; justify-content: center">

    </a>
    <div style="display: flex; flex-direction: column; align-items: center; color: #FFFFFF">
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800; line-height: 1.1">Memorise · Al-Ikhlas</span>
      <span style="font-size: 12px; font-weight: 700; color: #CDE7DF">Ayah 2 of 4</span>
    </div>
    <div style="width: 48px"></div>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 18px 14px">
    <div style="flex: 1; background: #F2B33D; border-radius: 14px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-size: 12px; font-weight: 800">1 · Listen</span>
      <span style="font-size: 11px; font-weight: 800">3 of 3</span>
    </div>
    <div style="flex: 1; background: #FFFFFF; border-radius: 14px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 0 0 3px #F2B33D">
      <span style="font-size: 12px; font-weight: 800">2 · Repeat</span>
      <span style="font-size: 11px; font-weight: 800; color: #5B6661">1 of 3</span>
    </div>
    <div style="flex: 1; background: #0A5A4D; border-radius: 14px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #CDE7DF">
      <span style="font-size: 12px; font-weight: 800">3 · On my own</span>
      <span style="font-size: 11px; font-weight: 800">locked</span>
    </div>
  </div>

  <div style="flex-grow: 1; background: #FBF6EC; border-radius: 32px 32px 0 0; padding: 22px 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <div dir="rtl" lang="ar" style="display: flex; flex-direction: column; gap: 14px">
      <p style="margin: 0; font-family: 'Amiri Quran', serif; font-size: 24px; line-height: 1.9; color: #7D8A85">قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾</p>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; box-shadow: 0 2px 0 #EADFC8">
        <p style="margin: 0; font-family: 'Amiri Quran', serif; font-size: 40px; line-height: 1.9; text-align: center"><span style="background: #FCE7B8; border-radius: 10px; padding: 0 6px">اللَّهُ</span> الصَّمَدُ <span style="color: #0F6B5C; font-size: 30px">﴿٢﴾</span></p>
      </div>
      <p style="margin: 0; font-family: 'Amiri Quran', serif; font-size: 24px; line-height: 1.9; color: #B8AE97">لَمْ ▁▁▁ وَلَمْ ▁▁▁ ﴿٣﴾</p>
    </div>
    <p style="margin: 0; text-align: center; font-size: 14px; font-weight: 700; color: #5B6661">Allah, the Eternal Refuge.</p>

    <div style="flex-grow: 1"></div>

    <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
      <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #D9CDB2; background: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; color: #23302C; cursor: pointer">Reciter: Child voice</button>
      <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #D9CDB2; background: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; color: #23302C; cursor: pointer">Speed 0.75×</button>
      <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid #D9CDB2; background: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; color: #23302C; cursor: pointer">Repeat 3×</button>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 28px">
      <button type="button" aria-label="Previous ayah" style="width: 52px; height: 52px; border-radius: 50%; border: none; background: #EDE4D0; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#23302C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-8 6 8 6zM6 6v12"></path></svg>
      </button>
      <button type="button" aria-label="Record my reading" style="width: 88px; height: 88px; border-radius: 50%; border: 6px solid #F7D3C5; background: #E0734F; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3.5 3.5 0 0 0-3.5 3.5v5a3.5 3.5 0 0 0 7 0v-5A3.5 3.5 0 0 0 12 3z" fill="#FFFFFF"></path><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5V21"></path></svg>
      </button>
      <button type="button" aria-label="Play reciter" style="width: 52px; height: 52px; border-radius: 50%; border: none; background: #0F6B5C; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="#FFFFFF"></path></svg>
      </button>
    </div>
    <p style="margin: 0; text-align: center; font-size: 14px; font-weight: 800">Your turn! Read Ayah 2 after the reciter.</p>
  </div>
</div>
</x-dc>
